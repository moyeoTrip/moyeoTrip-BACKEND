spring:
  application:
    name: MoyeoTrip
  ai:
    model:
      chat: none
      embedding: none
      image: openai
      audio:
        transcription: none
        speech: none
      moderation: none
    openai:
      image:
        model: gpt-image-2
        quality: low
        n: 1
        size: 1024x1024
  config:
    # Spring Boot does not load .env automatically. Treat the project-root .env as a properties file.
    import: optional:file:.env[.properties]
  # DB / JPA / Hikari 공통 설정은 모든 profile 에서 로드 — Spring 의 `application-{profile}.yml` 자동 매핑은
  profiles:
    include:
      - database
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB
  cloud:
    compatibility-verifier:
      enabled: false
  threads:
    virtual:
      enabled: true
  web:
    error:
      whitelabel:
        enabled: false
server:
  forward-headers-strategy: framework
  shutdown: graceful

management:
  server:
    port: 8888
  endpoints:
    web:
      exposure:
        include: health

springdoc:
  swagger-ui:
    tagsSorter: alpha
    enabled: true
  api-docs:
    path: /api-docs
