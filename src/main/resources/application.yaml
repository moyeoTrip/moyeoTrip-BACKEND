spring:
  application:
    name: MoyeoTrip
  config:
    # Spring Boot does not load .env automatically. Treat the project-root .env as a properties file.
    import: optional:file:.env[.properties]
  # DB / JPA / Hikari 공통 설정은 모든 profile 에서 로드 — Spring 의 `application-{profile}.yml` 자동 매핑은
  profiles:
    include:
      - database
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB
  cloud:
    compatibility-verifier:
      enabled: false
    aws:
      s3:
        bucket: ${AWS_S3_BUCKET}
        cdn-url: ${AWS_S3_CDN_URL}
  threads:
    virtual:
      enabled: true
  web:
    error:
      whitelabel:
        enabled: false
server:
  forward-headers-strategy: framework
  shutdown: graceful

management:
  server:
    port: 8888
  endpoints:
    web:
      exposure:
        include: health

springdoc:
  swagger-ui:
    tagsSorter: alpha
    enabled: true
  api-docs:
    path: /api-docs

jwt:
  access-key: ${JWT_ACCESS_KEY}
  refresh-key: ${JWT_REFRESH_KEY}
  access-token-expiration-time: ${JWT_ACCESS_TOKEN_EXPIRATION_TIME}
  refresh-token-expiration-time: ${JWT_REFRESH_TOKEN_EXPIRATION_TIME}

apple:
  oauth2:
    client-id: ${APPLE_CLIENT_ID}
    team-id: ${APPLE_TEAM_ID}
    key-id: ${APPLE_KEY_ID}
    p8-private-key: ${APPLE_P8_PRIVATE_KEY}
    redirect-url: ${APPLE_REDIRECT_URL}

client:
  tour-api:
    apiKey: ${TOUR_API_KEY}
firebase:
  firebaseServiceAccountJson: ${FIREBASE_SERVICE_ACCOUNT_JSON}
