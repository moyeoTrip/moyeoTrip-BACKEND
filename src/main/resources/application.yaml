spring:
  application:
    name: MoyeoTrip
  ai:
    model:
      chat: none
      embedding: none
      image: openai
      audio:
        transcription: none
        speech: none
      moderation: none
    openai:
      image:
        model: gpt-image-2
        quality: low
        n: 1
        size: 1024x1024
  # DB / JPA / Hikari 공통 설정은 모든 profile 에서 로드 — Spring 의 `application-{profile}.yml` 자동 매핑은
  profiles:
    include:
      - database
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 21MB
  cloud:
    compatibility-verifier:
      enabled: false
  threads:
    virtual:
      enabled: true
  web:
    error:
      whitelabel:
        enabled: false
server:
  forward-headers-strategy: framework
  shutdown: graceful

kakao:
  allowed-redirect-uris: https://moyeo-trip.jayden-bin.cc/

moyeotrip:
  web:
    cors:
      allowed-origins: http://localhost:4173,http://127.0.0.1:4173,http://localhost:5173,http://127.0.0.1:5173,https://moyeo-trip.jayden-bin.cc
      max-age-seconds: 3600

sentry:
  environment: ${SPRING_PROFILES_ACTIVE:local}
  sample-rate: 1.0
  traces-sample-rate: 1.0
  send-default-pii: false
  max-request-body-size: none
  # 처리되지 않은 예외는 SDK가 보조 수집하고, 처리된 HTTP·보안·WebSocket 오류는 애플리케이션에서 명시적으로 전송한다.
  exception-resolver-order: 2147483647
  logging:
    # Trace 로그의 request/response 본문을 Sentry 로그 이벤트로 중복 전송하지 않는다.
    enabled: false
  metrics:
    # SDK 기본값이 false 라 켜지 않으면 Sentry.metrics() 호출이 전부 no-op 이 된다.
    enabled: true
  in-app-includes:
    - kr.hanchae.moyeotrip

management:
  server:
    port: 8888
  endpoints:
    web:
      exposure:
        include: health

springdoc:
  swagger-ui:
    tagsSorter: alpha
    enabled: true
  api-docs:
    path: /api-docs

client:
  tour:
    tour-api-key: ${TOUR_API_KEY}
