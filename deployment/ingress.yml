apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: moyeo-trip-api-redirect-https
  namespace: stable
spec:
  redirectScheme:
    scheme: https
    permanent: true
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: moyeo-trip-api-buffering
  namespace: stable
spec:
  buffering:
    maxRequestBodyBytes: 52428800
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: moyeo-trip-api-ingress-redirect
  namespace: stable
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
    traefik.ingress.kubernetes.io/router.middlewares: stable-moyeo-trip-api-redirect-https@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - host: moyeo-trip-api.jayden-bin.cc
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: moyeo-trip-api-svc
                port:
                  number: 80
          - path: /swagger-ui
            pathType: Prefix
            backend:
              service:
                name: moyeo-trip-api-svc
                port:
                  number: 80
          - path: /api-docs
            pathType: Prefix
            backend:
              service:
                name: moyeo-trip-api-svc
                port:
                  number: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: moyeo-trip-api-ingress
  namespace: stable
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.middlewares: stable-moyeo-trip-api-buffering@kubernetescrd
    traefik.ingress.kubernetes.io/router.tls: "true"
    cert-manager.io/cluster-issuer: letsencrypt-prod
    kubernetes.io/tls-acme: "true"
spec:
  ingressClassName: traefik
  rules:
    - host: moyeo-trip-api.jayden-bin.cc
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: moyeo-trip-api-svc
                port:
                  number: 80
          - path: /swagger-ui
            pathType: Prefix
            backend:
              service:
                name: moyeo-trip-api-svc
                port:
                  number: 80
          - path: /api-docs
            pathType: Prefix
            backend:
              service:
                name: moyeo-trip-api-svc
                port:
                  number: 80
  tls:
    - hosts:
        - moyeo-trip-api.jayden-bin.cc
      secretName: moyeo-trip-ssl-cert
