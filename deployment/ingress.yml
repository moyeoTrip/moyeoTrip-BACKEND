apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: moyeo-trip-api-redirect-https
  namespace: stable
spec:
  redirectScheme:
    scheme: https
    permanent: true
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: moyeo-trip-api-buffering
  namespace: stable
spec:
  buffering:
    maxRequestBodyBytes: 52428800
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: moyeo-trip-api-ingress-redirect
  namespace: stable
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
    traefik.ingress.kubernetes.io/router.middlewares: stable-moyeo-trip-api-redirect-https@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - host: moyeo-trip-api.jayden-bin.cc
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: moyeo-trip-api-svc
                port:
                  number: 80
          - path: /swagger-ui
            pathType: Prefix
            backend:
              service:
                name: moyeo-trip-api-svc
                port:
                  number: 80
          - path: /api-docs
            pathType: Prefix
            backend:
              service:
                name: moyeo-trip-api-svc
                port:
                  number: 80
          # 채팅 실시간 채널(STOMP 핸드셰이크). 이 줄이 없어서 서버에 구현이 다 돼 있는데도
          # 운영에서 404 였고, 세 클라이언트가 전부 폴링으로 돌아갔다 (QA BE-27).
          # 여기(:80 리다이렉트 라우터)에도 두는 이유는 http 로 들어온 요청을 https 로 넘기기 위해서다.
          - path: /ws
            pathType: Prefix
            backend:
              service:
                name: moyeo-trip-api-svc
                port:
                  number: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: moyeo-trip-api-ingress
  namespace: stable
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.middlewares: stable-moyeo-trip-api-buffering@kubernetescrd
    traefik.ingress.kubernetes.io/router.tls: "true"
    cert-manager.io/cluster-issuer: letsencrypt-prod
    kubernetes.io/tls-acme: "true"
spec:
  ingressClassName: traefik
  rules:
    - host: moyeo-trip-api.jayden-bin.cc
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: moyeo-trip-api-svc
                port:
                  number: 80
          - path: /swagger-ui
            pathType: Prefix
            backend:
              service:
                name: moyeo-trip-api-svc
                port:
                  number: 80
          - path: /api-docs
            pathType: Prefix
            backend:
              service:
                name: moyeo-trip-api-svc
                port:
                  number: 80
          # 채팅 실시간 채널(STOMP 핸드셰이크) — 클라이언트가 실제로 붙는 곳은 여기(https)다.
          # Traefik 은 WebSocket 업그레이드를 따로 켤 필요 없이 그대로 넘긴다.
          - path: /ws
            pathType: Prefix
            backend:
              service:
                name: moyeo-trip-api-svc
                port:
                  number: 80
  tls:
    - hosts:
        - moyeo-trip-api.jayden-bin.cc
      secretName: moyeo-trip-ssl-cert
